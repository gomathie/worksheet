<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSignal Ledger — Team Timesheet &amp; Tracker</title>
    <meta
      name="description"
      content="OpenSignal Ledger: log team hours and work output, track points-based remuneration, bonuses and payouts."
    />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link id="manifest" rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#128F72" />
    <link id="apple-touch-icon" rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Festive icons 1 Nov – 9 Jan; same window as shared/season.ts (keep in
      // sync). Runs before the browser reads the manifest.
      ;(function () {
        var d = new Date(), m = d.getMonth()
        if (!(m === 10 || m === 11 || (m === 0 && d.getDate() < 10))) return
        document.getElementById('favicon').href = '/favicon-festive.svg'
        document.getElementById('manifest').href = '/manifest-festive.webmanifest'
        document.getElementById('apple-touch-icon').href = '/apple-touch-icon-festive.png'
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />
    <!-- Link previews (WhatsApp, Slack, social) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenSignal Ledger" />
    <meta property="og:title" content="OpenSignal Ledger — Team Timesheet &amp; Tracker" />
    <meta
      property="og:description"
      content="Log team hours and work output, track points-based remuneration, bonuses and payouts."
    />
    <meta property="og:url" content="https://ledger-6pa.pages.dev/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="OpenSignal Ledger — Team Timesheet &amp; Tracker" />
    <meta
      name="twitter:description"
      content="Log team hours and work output, track points-based remuneration, bonuses and payouts."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
